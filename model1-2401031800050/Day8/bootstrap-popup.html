<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bootstrap Registration Popup Form</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>

<body class="bg-light">

  <!-- Main Container -->
  <div class="container text-center mt-5">

    <h1 class="mb-4 text-primary">
      Bootstrap Registration Form Popup
    </h1>

    <!-- Open Popup Button -->
    <button
      type="button"
      class="btn btn-primary btn-lg"
      data-bs-toggle="modal"
      data-bs-target="#registerModal"
    >
      Open Registration Form
    </button>

  </div>

  <!-- Modal Start -->
  <div
    class="modal fade"
    id="registerModal"
    tabindex="-1"
    aria-hidden="true"
  >

    <div class="modal-dialog">

      <div class="modal-content">

        <!-- Modal Header -->
        <div class="modal-header bg-primary text-white">

          <h4 class="modal-title">
            Registration Form
          </h4>

          <button
            type="button"
            class="btn-close btn-close-white"
            data-bs-dismiss="modal"
          ></button>

        </div>

        <!-- Modal Body -->
        <div class="modal-body">

          <form>

            <!-- Full Name -->
            <div class="mb-3">
              <label class="form-label">
                Full Name
              </label>

              <input
                type="text"
                class="form-control"
                placeholder="Enter your name"
              >
            </div>

            <!-- Email -->
            <div class="mb-3">
              <label class="form-label">
                Email Address
              </label>

              <input
                type="email"
                class="form-control"
                placeholder="Enter your email"
              >
            </div>

            <!-- Password -->
            <div class="mb-3">
              <label class="form-label">
                Password
              </label>

              <input
                type="password"
                class="form-control"
                placeholder="Enter password"
              >
            </div>

            <!-- Mobile Number -->
            <div class="mb-3">
              <label class="form-label">
                Mobile Number
              </label>

              <input
                type="tel"
                class="form-control"
                placeholder="Enter mobile number"
              >
            </div>

            <!-- Gender -->
            <div class="mb-3">

              <label class="form-label d-block">
                Gender
              </label>

              <div class="form-check form-check-inline">

                <input
                  class="form-check-input"
                  type="radio"
                  name="gender"
                >

                <label class="form-check-label">
                  Male
                </label>

              </div>

              <div class="form-check form-check-inline">

                <input
                  class="form-check-input"
                  type="radio"
                  name="gender"
                >

                <label class="form-check-label">
                  Female
                </label>

              </div>

            </div>

            <!-- Course -->
            <div class="mb-3">

              <label class="form-label">
                Select Course
              </label>

              <select class="form-select">

                <option selected>
                  Choose Course
                </option>

                <option>BCA</option>
                <option>B.Tech</option>
                <option>B.Sc</option>
                <option>MCA</option>

              </select>

            </div>

            <!-- Checkbox -->
            <div class="form-check mb-3">

              <input
                class="form-check-input"
                type="checkbox"
              >

              <label class="form-check-label">
                I agree to Terms & Conditions
              </label>

            </div>

            <!-- Submit Button -->
            <button
              type="submit"
              class="btn btn-success w-100"
            >
              Register
            </button>

          </form>

        </div>

      </div>

    </div>

  </div>
  <!-- Modal End -->

  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>

</body>
</html>
