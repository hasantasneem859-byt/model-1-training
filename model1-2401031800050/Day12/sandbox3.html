<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>React Input Example</title>

  <!-- React CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>

  <!-- React DOM CDN -->
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>

    body {

      font-family: Arial, sans-serif;

      padding: 40px;

      background: #cdd0d5;
    }

    input {

      padding: 10px;

      width: 250px;

      font-size: 16px;

      border: 2px solid #999;

      border-radius: 5px;
    }

    p {

      font-size: 24px;

      margin-top: 20px;

      color: #333;
    }

    button {

      margin-top: 20px;

      padding: 10px 20px;

      font-size: 16px;

      border: none;

      background: #222;

      color: white;

      border-radius: 5px;

      cursor: pointer;
    }

    button:hover {

      background: #444;
    }

  </style>

</head>

<body>

  <div id="root"></div>

  <script type="text/babel">

    function App() {

      // State
      const [text, setText] = React.useState("Hello Silver Oak");

      // Handle Input
      function handleChange(event) {

        setText(event.target.value);
      }

      // Reset Function
      function resetText() {

        setText("");
      }

      return (

        <div>

          {/* Input Box */}
          <input
            type="text"
            value={text}
            onChange={handleChange}
            placeholder="Type something..."
          />

          {/* Output */}
          <p>

            You typed: {text}

          </p>

          {/* Reset Button */}
          <button onClick={resetText}>

            Reset

          </button>

        </div>
      );
    }

    // Render React App
    const root = ReactDOM.createRoot(
      document.getElementById("root")
    );

    root.render(<App />);

  </script>

</body>

</html>
