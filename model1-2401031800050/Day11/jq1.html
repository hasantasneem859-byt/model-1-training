<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zebra Stripes Table Effect</title>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 30px;
        }

        table{
            width: 70%;
            margin: auto;
            border-collapse: collapse;
            background-color: white;
        }

        th, td{
            border: 1px solid #ccc;
            padding: 12px;
            text-align: center;
        }

        th{
            background-color: #333;
            color: white;
        }

        /* Light Blue Row */
        .evenRow{
            background-color: #d9f3ff;
        }

        /* Light Green Row */
        .oddRow{
            background-color: #dfffe0;
        }

        /* Hover Effect */
        tr:hover{
            background-color: #fff3b0;
        }
    </style>
</head>
<body>

    <h2 align="center">Zebra Stripes Table using jQuery</h2>

    <table id="studentTable">

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Course</th>
            <th>City</th>
        </tr>

        <tr>
            <td>101</td>
            <td>Ayaan</td>
            <td>CSE</td>
            <td>Delhi</td>
        </tr>

        <tr>
            <td>102</td>
            <td>Sara</td>
            <td>IT</td>
            <td>Mumbai</td>
        </tr>

        <tr>
            <td>103</td>
            <td>Ali</td>
            <td>ECE</td>
            <td>Ahmedabad</td>
        </tr>

        <tr>
            <td>104</td>
            <td>Zoya</td>
            <td>AI & DS</td>
            <td>Surat</td>
        </tr>

        <tr>
            <td>105</td>
            <td>Rehan</td>
            <td>Mechanical</td>
            <td>Pune</td>
        </tr>

    </table>

    <script>
        $(document).ready(function(){

            // Zebra Stripe Effect
            $("#studentTable tr:even").addClass("evenRow");
            $("#studentTable tr:odd").addClass("oddRow");

        });
    </script>

</body>
</html>
