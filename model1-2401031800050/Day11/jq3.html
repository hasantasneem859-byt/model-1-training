<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remove Table Row using jQuery</title>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 30px;
        }

        table{
            width: 70%;
            margin: auto;
            border-collapse: collapse;
            background-color: white;
        }

        th, td{
            border: 1px solid #ccc;
            padding: 12px;
            text-align: center;
        }

        th{
            background-color: #333;
            color: white;
        }

        /* Zebra Colors */
        tr:nth-child(even){
            background-color: #d9f3ff; /* Light Blue */
        }

        tr:nth-child(odd){
            background-color: #dfffe0; /* Light Green */
        }

        button{
            padding: 8px 15px;
            border: none;
            background-color: crimson;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background-color: darkred;
        }
    </style>
</head>
<body>

    <h2 align="center">Remove Table Row using jQuery</h2>

    <table id="studentTable">

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Course</th>
            <th>Action</th>
        </tr>

        <tr>
            <td>101</td>
            <td>Ayaan</td>
            <td>CSE</td>
            <td><button class="deleteBtn">Remove</button></td>
        </tr>

        <tr>
            <td>102</td>
            <td>Sara</td>
            <td>IT</td>
            <td><button class="deleteBtn">Remove</button></td>
        </tr>

        <tr>
            <td>103</td>
            <td>Ali</td>
            <td>ECE</td>
            <td><button class="deleteBtn">Remove</button></td>
        </tr>

        <tr>
            <td>104</td>
            <td>Zoya</td>
            <td>AI & DS</td>
            <td><button class="deleteBtn">Remove</button></td>
        </tr>

    </table>

    <script>
        $(document).ready(function(){

            $(".deleteBtn").click(function(){

                // Remove current row
                $(this).closest("tr").remove();

            });

        });
    </script>

</body>
</html>
