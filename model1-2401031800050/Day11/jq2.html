<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Move Div using jQuery</title>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body{
            font-family: Arial, sans-serif;
            padding: 30px;
            background-color: #f5f5f5;
        }

        /* Container Style */
        .container{
            width: 300px;
            height: 220px;
            border: 3px solid #555;
            margin: 20px;
            padding: 10px;
            display: inline-block;
            vertical-align: top;
            border-radius: 10px;
        }

        /* Light Colors for Containers */
        #container1{
            background-color: #d9f3ff;   /* Light Blue */
        }

        #container2{
            background-color: #dfffe0;   /* Light Green */
        }

        /* Box Style */
        #box{
            width: 100px;
            height: 100px;
            background-color: #4da6ff;
            color: white;
            text-align: center;
            line-height: 100px;
            font-weight: bold;
            border-radius: 10px;
            margin-top: 20px;
        }

        button{
            padding: 10px 20px;
            margin: 20px;
            cursor: pointer;
            border: none;
            background-color: #333;
            color: white;
            border-radius: 5px;
            font-size: 16px;
        }

        button:hover{
            background-color: #555;
        }
    </style>
</head>
<body>

    <h2>Move One Div Inside Another using jQuery</h2>

    <!-- First Container -->
    <div class="container" id="container1">
        <h3>Container 1</h3>

        <div id="box">
            BOX
        </div>
    </div>

    <!-- Second Container -->
    <div class="container" id="container2">
        <h3>Container 2</h3>
    </div>

    <br>

    <button id="moveBtn">Move Div</button>

    <script>
        $(document).ready(function(){

            $("#moveBtn").click(function(){

                // Move BOX to Container 2
                $("#box").appendTo("#container2");

            });

        });
    </script>

</body>
</html>
